            </ul>
        </div>

<section class="container my-5">
    <h1 class="text-center section-title mb-5">Контакти</h1>

    <div class="row g-5">

        <div class="col-md-5">
            <h3>Зв'яжіться з нами</h3>

            <p class="mt-4">
                <strong>Назва:</strong><br>
                Освітній коледж
            </p>

            <p>
                <strong>Адреса:</strong><br>
                Україна, Закарпатська область
            </p>

            <p>
                <strong>Телефон:</strong><br>
                +380 00 000 00 00
            </p>

            <p>
                <strong>Email:</strong><br>
                college@example.com
            </p>
        </div>

        <div class="col-md-7">
            <div class="card shadow p-4">
                <h3 class="mb-4">Напишіть нам</h3>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Ім'я</label>
                        <input type="text" class="form-control"
                               placeholder="Введіть ваше ім'я" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               placeholder="example@gmail.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Тема звернення</label>
                        <input type="text" class="form-control"
                               placeholder="Введіть тему" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Повідомлення</label>
                        <textarea class="form-control" rows="5"
                                  placeholder="Ваше повідомлення"
                                  required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Надіслати
                    </button>
                </form>
            </div>
        </div>

    </div>
</section>

<footer class="footer text-center text-white py-4">
